<!DOCTYPE html>

<html>
    <head>
        <title>DentaFlow</title>
    </head>
    <body>
        <div class="main-container">
            <h2>Book an Appointment</h2>
            <form action="">
                <p>Please confirm that you would like to request the following appointment:</p>
                <label for="appointment-date">Appointment Date:</label><br>
                <input type="date" id="appointment-date" name="appointment-date" ><br><br>
                
                <label for="first-name">First name:</label><br>
                <input type="text" id="first-name" name="first-name" value="Juan" disabled><br><br>
                
                
                <label for="last-name">Last name:</label><br>
                <input type="text" id="last-name" name="last-name" value="Dela Cruz" disabled><br><br>
                
                     
                <label for="birthdate">Appointment Date:</label><br>
                <input type="date" id="birthdate" name="birthdate" ><br><br>
                

                <label for="email">Email:</label><br>
                <input type="mail" id="email" name="email" value="" ><br><br>
                

                <label for="service">Type of Service:</label>
                <select name="service" id="service">
                <option value=""></option>
                <option value="extraction">Tooth Extraction</option>
                <option value="root">Root Canal</option>
                <option value="cleaning">Cleaning</option>
                <option value="restoration">Tooth Restoration</option>
                </select>

                <br><br>

                <label for="dentist">Dentist:</label>
                <select name="dentist" id="dentist">
                <option value=""></option>
                <option value="hanna">Dra. Hanna Ignacio</option>
                <option value="tovy">Dr. Tovy Tongson</option>
                <option value="kurt">Dr. Kurt Gozon</option>
                <option value="xyril">Dra. Xyril Fabellon</option>
                </select>

                <br><br>
                <input type="submit" value="Book Appoinment">
                <input type="submit" value="Cancel">
            </form>
        </div>
    </body>
</html>
