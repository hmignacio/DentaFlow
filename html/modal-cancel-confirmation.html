<!doctype html>

<html>
  <head>
    <title>DentaFlow</title>
    <link rel="stylesheet" href="../css/dashboard-modal.css" />
  </head>
  <body>
    <div class="main-container">
      <h2>Cancel Appointment?</h2>
      <form action="">
        <p>
          Are you sure you want to cancel your appointment?<br /><br />
          Once cancelled, your scheduled time slot will become available to
          other patients.
        </p>
        <br /><br />

        <div class="form-buttons">
          <input type="submit" value="Keep Appointment" />
          <input type="button" value="Yes, Cancel" />
        </div>
      </form>
    </div>
  </body>
</html>
